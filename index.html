<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursorling</title>
    <meta
      name="description"
      content="A tiny ink-blot familiar that lives near your mouse."
    />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:title" content="Cursorling" />
    <meta property="og:image" content="/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="lamp" aria-hidden="true"></div>
    <div class="lamp-brass" aria-hidden="true"></div>
    <div class="grain studio-grain" aria-hidden="true"></div>
    <div class="desk">
      <div class="blotter" id="blotter" aria-hidden="true">
        <span class="corner c1"></span>
        <span class="corner c2"></span>
        <span class="corner c3"></span>
        <span class="corner c4"></span>
      </div>
    </div>
    <div id="stage"></div>
    <header>
      <img class="mark" src="/logo.svg" alt="" width="52" height="52" />
      <div class="header-copy">
        <p class="accession">FT–001</p>
        <h1>Cursorling</h1>
        <p class="lede">
          A blot of ink that learned the mouse. It sits a little southeast of the
          pointer and has opinions.
        </p>
      </div>
    </header>
    <aside class="pad">
      <p class="pad-label">temperament</p>
      <nav class="personas" aria-label="Personality">
        <button type="button" data-persona="chill">chill</button>
        <button type="button" data-persona="dramatic">dramatic</button>
        <button type="button" data-persona="judgmental">judgmental</button>
        <button type="button" data-persona="sleepy">sleepy</button>
        <button type="button" data-persona="chaotic">chaotic</button>
      </nav>
      <p class="hint">
        Move. Click. Type. Wait. It yawns when you abandon it, stretches when you
        flee, hops when you strike the desk.
      </p>
      <p class="pad-label">skin</p>
      <nav id="themes" class="personas" aria-label="Theme packs"></nav>
      <button type="button" id="snapshot" class="shot">Cursorling said this</button>
    </aside>
    <footer class="webring">
      <a href="https://fun-toys-alpha.vercel.app">a Fun Toy</a>
      ·
      <a href="https://rake-garden.vercel.app">prev</a>
      <a href="https://please-press.vercel.app">next</a>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
